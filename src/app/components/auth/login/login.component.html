

    <div class="main">
        <h3>Enter your login credentials</h3>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <label for="first">
                Email:
            </label>
            <input formControlName="email" type="text" id="first" name="first"
                placeholder="Enter your Email" required>

            <label for="password">
                Password:
            </label>
            <input formControlName="password" type="password" id="password" name="password"
                placeholder="Enter your Password" required>

            <div class="wrap">
                <button [disabled]="loginForm.invalid" type="submit">
                    Submit
                </button>
            </div>
        </form>

        <p>Not registered?
            <a href="#" style="text-decoration: none;" (click)="gotoSignup()">
                Create an account
            </a>
        </p>
    </div>
