<div class="posts-container">
  @if (isLoading()) {
    <p>Loading posts...</p>
  } @else {
    @if (posts().length > 0) {
      @for (post of posts(); track post.id) {
        <div class="post-item">
          <h3>{{ post.title }}</h3>
          <p>{{ post.body }}</p>
        </div>
      }
    } @else {
      <p>No posts available</p>
    }
  }
</div>
